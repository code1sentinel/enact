name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install OPA
        run: |
          curl -fsSL -o /usr/local/bin/opa \
            https://openpolicyagent.org/downloads/v1.8.0/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version

      - name: Install package
        run: uv sync --extra dev

      - name: Tests
        run: uv run pytest

      - name: Example (passing config)
        run: |
          uv run enact run \
            --oscal examples/access-control/catalog.json \
            --checks examples/access-control/checks.json \
            --input examples/access-control/inputs/passing.json \
            --workdir examples/access-control \
            --out /tmp/enact-pass \
            --title "Access-control example (passing)"

      - name: Example (failing config)
        run: |
          set +e
          uv run enact run \
            --oscal examples/access-control/catalog.json \
            --checks examples/access-control/checks.json \
            --input examples/access-control/inputs/failing.json \
            --workdir examples/access-control \
            --out /tmp/enact-fail \
            --title "Access-control example (failing)"
          status=$?
          set -e
          test "$status" -eq 1
          uv run enact validate \
            --assessment-results /tmp/enact-fail/assessment-results.json \
            --poam /tmp/enact-fail/poam.json \
            --catalog examples/access-control/catalog.json

      - name: Schema validation
        run: |
          uv run enact validate \
            --assessment-results /tmp/enact-pass/assessment-results.json \
            --poam /tmp/enact-pass/poam.json \
            --catalog examples/access-control/catalog.json
          uv run enact validate \
            --assessment-results /tmp/enact-fail/assessment-results.json \
            --poam /tmp/enact-fail/poam.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install package
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check src tests scripts contrib
      - name: Type check (lenient)
        run: uv run mypy src/enact

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install package
        run: uv sync --extra dev
      - name: pip-audit
        run: uv run pip-audit --skip-editable
      - name: Gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --verbose --redact
