[project]
name = "enact"
version = "0.1.0"
description = "Turn OSCAL controls into runnable checks and OSCAL assessment results."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "GRC Engineering Club" }]
keywords = ["oscal", "opa", "rego", "compliance", "fedramp", "codify"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "jsonschema>=4.23",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "pip-audit>=2.8",
]

[project.scripts]
enact = "enact.cli:app"

[project.urls]
Homepage = "https://github.com/code1sentinel/enact"
Documentation = "https://code1sentinel.github.io/enact/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enact"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "enact/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
src = ["src", "tests", "scripts"]
line-length = 120

[tool.ruff.lint]
# Correctness only on day one so this workflow PR does not touch product files.
# A later chore slice can enable F401 / style rules and clean imports.
select = ["E9", "F821", "F822", "F823"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
disallow_untyped_defs = false
pretty = true
